<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/png" href="/favicon.png">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#080808">
    <title>Urban Burger | Burgers artesanais com delivery</title>
    <meta name="description" content="Burgers artesanais com blend da casa, pão brioche e muito queijo. Monte seu pedido pelo site e receba em casa.">
    <!-- prévia ao compartilhar o link no WhatsApp/Instagram -->
    <meta property="og:type" content="website">
    <meta property="og:title" content="Urban Burger">
    <meta property="og:description" content="Burgers artesanais com delivery. Peça pelo site e confirme no WhatsApp.">
    <meta property="og:image" content="/fundo-burger.webp">
    <link rel="preload" as="image" href="/fundo-burger.webp">

    <!-- Tela de carregamento: CSS aqui mesmo para aparecer antes do JavaScript do site carregar -->
    <style>
      html, body { margin: 0; background: #080808; }
      #splash {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 28px;
        background:
          radial-gradient(circle at 50% 45%, rgba(8, 8, 8, 0.55), rgba(8, 8, 8, 0.92) 70%),
          #080808 url('/fundo-burger.webp') 25% center / cover no-repeat;
        transition: opacity 0.5s ease, visibility 0.5s;
      }
      #splash.saindo { opacity: 0; visibility: hidden; }
      #splash img { width: 200px; height: auto; animation: splash-pulsa 1.6s ease-in-out infinite; }
      #splash .barra { width: 160px; height: 3px; border-radius: 3px; background: rgba(255, 255, 255, 0.15); overflow: hidden; }
      #splash .barra::after {
        content: '';
        display: block;
        width: 40%;
        height: 100%;
        border-radius: 3px;
        background: #f5a900;
        animation: splash-corre 1.1s ease-in-out infinite;
      }
      #splash p { margin: 0; color: #cfcfcf; font: 600 0.85rem/1 system-ui, sans-serif; letter-spacing: 0.12em; text-transform: uppercase; }
      @keyframes splash-pulsa { 50% { transform: scale(1.04); } }
      @keyframes splash-corre { from { transform: translateX(-100%); } to { transform: translateX(250%); } }
      @media (prefers-reduced-motion: reduce) {
        #splash img, #splash .barra::after { animation: none; }
      }
    </style>
  </head>
  <body>
    <div id="splash" role="status" aria-label="Carregando o site">
      <img src="/logo.png" alt="Urban Burger">
      <div class="barra"></div>
      <p>Esquentando a chapa...</p>
    </div>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
